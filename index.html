<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EATER — Restaurant Guide</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous">
</head>
<body>
  <header class="ust">
    <h1 class="logo">EATER</h1>
    <div id="gezinme"></div>
  </header>

  <main class="govde">
    <section id="kureBolumu" class="kure-bolumu" hidden aria-label="World globe">
      <div id="kure"></div>
      <div class="konum-cubugu">
        <span class="arama-ikon" aria-hidden="true">🔍</span>
        <input id="konumArama" type="search" list="ulkeListesi"
               placeholder="Type a district, city or country…"
               aria-label="Search location" autocomplete="off">
        <datalist id="ulkeListesi"></datalist>
        <button id="btnKonumAra" type="button">Search</button>
        <button id="btnKonumum" type="button">📍 Use my location</button>
      </div>
      <p id="konumMesaj" class="silik konum-mesaj" aria-live="polite"></p>
      <p class="silik osm-kredi">Location search: © OpenStreetMap contributors</p>
    </section>
    <section id="haritaBolumu" class="harita-bolumu" hidden aria-label="City map">
      <div id="harita"></div>
      <p id="haritaNotu" class="silik harita-notu"></p>
    </section>
    <section id="filtreler" class="filtreler" aria-label="Filters"></section>
    <p id="sonucSayisi" class="sonuc-sayisi" aria-live="polite"></p>
    <section id="liste" class="liste"></section>
  </main>

  <footer class="alt">
    <p>Scores are subjective assessments drawn from a sample of user reviews.
       No overall score is computed — food, ambiance and service are always rated separately.</p>
    <p class="silik">The — mark means no verified data was found for that field.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"
          integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O"
          crossorigin="anonymous"></script>
  <script src="ayarlar.js"></script>
  <script src="veri.js"></script>
  <script src="bilesenler.js"></script>
  <script src="hesap.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"
          integrity="sha384-fS13P48RBFel+cPUp5960AhzvtEr64LerQ00neZuM+Hi/VDxxemdQnN7IcWPYvPb" crossorigin="anonymous"></script>
  <script src="dunya-ulkeler.js"></script>
  <script src="kure.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
          crossorigin="anonymous"></script>
  <script src="harita.js"></script>
</body>
</html>
