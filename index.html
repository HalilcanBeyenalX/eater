<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EATER — Restoran Rehberi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="ust">
    <h1 class="logo">EATER</h1>
    <div id="gezinme"></div>
  </header>

  <main class="govde">
    <section id="kureBolumu" class="kure-bolumu" hidden aria-label="Dünya küresi">
      <div id="kure"></div>
      <div class="konum-cubugu">
        <input id="konumArama" type="search" placeholder="Semt, şehir veya ülke yaz…"
               aria-label="Konum ara">
        <button id="btnKonumAra" type="button">Ara</button>
        <button id="btnKonumum" type="button">📍 Konumumu kullan</button>
      </div>
      <p id="konumMesaj" class="silik konum-mesaj" aria-live="polite"></p>
      <p class="silik osm-kredi">Konum araması: © OpenStreetMap katkıcıları</p>
    </section>
    <section id="filtreler" class="filtreler" aria-label="Filtreler"></section>
    <p id="sonucSayisi" class="sonuc-sayisi" aria-live="polite"></p>
    <section id="liste" class="liste"></section>
  </main>

  <footer class="alt">
    <p>Puanlar, kullanıcı yorumlarından oluşan bir örneklemden çıkarılmış öznel değerlendirmelerdir.
       Genel puan hesaplanmaz — yemek, ambiyans ve servis ayrı ayrı değerlendirilir.</p>
    <p class="silik">— işareti, ilgili alan için doğrulanmış bir veri bulunamadığını gösterir.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"
          integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O"
          crossorigin="anonymous"></script>
  <script src="ayarlar.js"></script>
  <script src="veri.js"></script>
  <script src="bilesenler.js"></script>
  <script src="hesap.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"
          integrity="sha384-fS13P48RBFel+cPUp5960AhzvtEr64LerQ00neZuM+Hi/VDxxemdQnN7IcWPYvPb" crossorigin="anonymous"></script>
  <script src="dunya-ulkeler.js"></script>
  <script src="kure.js"></script>
</body>
</html>
