# Supabase ücretsiz planda 7 gün hareketsiz kalan projeyi duraklatıyor
# (12 Eylül 2026'da EATER bu yüzden durdu). Bu iş 3 günde bir REST API'ye
# minik bir okuma isteği atarak projeyi "aktif" tutar. Anon anahtar zaten
# sitenin kaynak kodunda herkese açık — burada sır değeri yok.
name: Supabase canli tut

on:
  schedule:
    - cron: "17 6 */3 * *"   # 3 günde bir 06:17 UTC
  workflow_dispatch: {}       # elle de tetiklenebilir

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: REST API'ye okuma isteği at
        run: |
          KEY=$(curl -s https://raw.githubusercontent.com/HalilcanBeyenalX/eater/main/ayarlar.js \
                | grep -o "SUPABASE_ANON_KEY = '[^']*'" | cut -d"'" -f2)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            "https://iivaqexcmdupaibkggpy.supabase.co/rest/v1/profiller?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $HTTP"
          # Proje duraklatılmışsa istek zaten ulaşmaz; işi kırmızıya boyayıp
          # e-posta seli yaratmasın diye her sonuç başarılı sayılır.
          exit 0
